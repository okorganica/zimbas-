<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zimbas Industries | Textile ERP</title>
<style>
:root{--navy:#10253f;--navy2:#193b5a;--teal:#10a7a0;--bg:#f3f6fa;--ink:#1b2a3b;--muted:#6b7a8c;--line:#e4ebf2;--white:#fff;--red:#c2414b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--navy);color:#fff;padding:23px 15px;flex-shrink:0}.brand{font-size:18px;font-weight:850;letter-spacing:.5px;padding:0 10px}.brand small{display:block;font-size:10px;color:#a8c1d8;font-weight:600;letter-spacing:1.4px;margin-top:5px}.nav{margin-top:28px}.nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:transparent;color:#cfdeed;padding:12px;border-radius:9px;margin:3px 0}.nav button:hover,.nav button.active{background:#244360;color:#fff}.nav .ico{width:20px;text-align:center}.sidefoot{font-size:11px;color:#a8c1d8;padding:20px 10px}.main{flex:1;min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.crumb{font-weight:750;font-size:16px}.user{display:flex;gap:10px;align-items:center;color:var(--muted)}.avatar{background:#dff5f2;color:#087a74;font-weight:800;padding:8px 10px;border-radius:50%}.content{padding:28px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.heading h1{font-size:26px;letter-spacing:-.5px;margin:0}.heading p{color:var(--muted);margin:4px 0}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:750}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#e9eff5;color:#243d56}.btn.danger{background:#fae8e9;color:#a22f39}.btn.small{padding:6px 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 3px 10px #142c4205;margin-bottom:18px}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.55px}.staticon{background:#e6f7f5;color:#07847d;border-radius:9px;padding:9px}.stat{font-size:30px;font-weight:850;margin-top:12px;letter-spacing:-1px}.statnote{font-size:12px;color:var(--muted);margin-top:3px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.cardtitle{font-weight:800;font-size:16px;margin:0 0 15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1f5}th{font-size:10px;text-transform:uppercase;letter-spacing:.65px;color:#718095;background:#fbfcfe}td{font-size:13px}tbody tr:hover{background:#fbfdff}.pill{display:inline-block;border-radius:30px;padding:4px 8px;background:#e4f7f4;color:#087b73;font-size:11px;font-weight:800}.pill.amber{background:#fff2d8;color:#976500}.pill.red{background:#fde8e9;color:#a32d38}.empty{text-align:center;padding:28px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;color:#4d5c6e;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7e0ea;background:#fff;border-radius:8px;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #10a7a018}.field textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;align-items:center}.search{max-width:320px;width:100%;padding:10px;border:1px solid #d7e0ea;border-radius:8px;background:white}.alert{padding:11px 14px;border-radius:9px;background:#fff3d8;color:#805a00;margin-bottom:14px}.notice{font-size:12px;color:var(--muted);background:#f6f9fc;border-radius:8px;padding:11px;margin-top:12px}.toast{position:fixed;right:24px;bottom:24px;background:#12344f;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 10px 35px #0002;z-index:10}.recipeitem{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:7px 0}.hide{display:none!important}.smallmuted{font-size:12px;color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.sidebar{width:100%;padding:14px}.brand small{display:none}.nav{display:flex;overflow:auto;gap:4px;margin-top:12px}.nav button{width:auto;white-space:nowrap;padding:9px}.sidefoot{display:none}.topbar{height:56px;padding:0 16px}.content{padding:16px}.heading{align-items:flex-start;flex-direction:column}.cards{gap:10px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.recipeitem{grid-template-columns:1fr 1fr}.recipeitem button{grid-column:1/-1}.heading h1{font-size:23px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">ZIMBAS INDUSTRIES<small>TEXTILE DYEING & PROCESSING ERP</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">Local demo edition · Data stays in this browser</div></aside><section class="main"><header class="topbar"><div class="crumb" id="topTitle">Factory Overview</div><div class="user"><span>Administrator</span><span class="avatar">ZI</span></div></header><main class="content" id="view"></main></section></div><div id="toast" class="toast hide"></div>
<script>
const menu=[["dashboard","▦","Dashboard"],["customers","♙","Customers"],["inventory","▤","Inventory & Store"],["recipes","◉","Color Recipes"],["batches","⚙","Production Batches"],["quality","✓","Quality Control"],["reports","▥","Reports & Export"],["settings","⚙","Settings"]];
let state={customers:[],materials:[],recipes:[],batches:[],quality:[],moves:[],logs:[]};
const initial={customers:[{id:1,name:"Demo Textile Customer",phone:"0300-0000000",email:"demo@example.com"}],materials:[{id:1,name:"Reactive Dye — Demo",category:"Dye",unit:"kg",stock:40,reorder:10,cost:1250,lot:"DEMO-LOT-01",expiry:""}],recipes:[],batches:[{id:1,no:"DEMO-B-001",customer:"Demo Textile Customer",fabric:"Cotton knitted",shade:"Navy demo",recipe:"",machine:"J-01",planned:250,actual:0,status:"Planned",notes:"Synthetic demo record"}],quality:[],moves:[],logs:[]};
function load(){try{let s=JSON.parse(localStorage.getItem("zimbasERP"));state=s||structuredClone(initial)}catch{state=structuredClone(initial)}}
function save(){localStorage.setItem("zimbasERP",JSON.stringify(state))}
function log(action,detail){state.logs.unshift({date:new Date().toLocaleString(),action,detail});save()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return "PKR "+Number(v||0).toLocaleString("en-PK",{maximumFractionDigits:2})}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.remove("hide");setTimeout(()=>x.classList.add("hide"),2500)}
function pill(s){let cl=["Completed","Approved","Pass","Received"].includes(s)?"":(["Hold","On Hold","Draft","Planned","Submitted"].includes(s)?"amber":(["Fail","Rejected","Cancelled","Low stock"].includes(s)?"red":""));return `<span class="pill ${cl}">${esc(s)}</span>`}
function table(headers,rows){if(!rows.length)return '<div class="empty">No records yet. Add your first record using the form above.</div>';return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??"—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function pagehead(title,desc,button=""){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function field(label,name,type="text",required=false,placeholder="",value=""){return `<div class="field"><label>${label}${required?" *":""}</label><input name="${name}" type="${type}" ${required?"required":""} placeholder="${placeholder}" value="${esc(value)}" ${type==="number"?'step="any"':''}></div>`}
function selectField(label,name,opts,required=false){return `<div class="field"><label>${label}</label><select name="${name}" ${required?"required":""}>${opts.map(o=>`<option value="${esc(o.value??o)}">${esc(o.label??o)}</option>`).join("")}</select></div>`}
function go(name){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));document.getElementById("topTitle").textContent=menu.find(m=>m[0]===name)[2];render(name)}
function initNav(){document.getElementById("nav").innerHTML=menu.map(m=>`<button data-page="${m[0]}" onclick="go('${m[0]}')"><span class="ico">${m[1]}</span>${m[2]}</button>`).join("")}
function render(p){let v=document.getElementById("view");v.innerHTML=({"dashboard":dashboard,"customers":customers,"inventory":inventory,"recipes":recipes,"batches":batches,"quality":quality,"reports":reports,"settings":settings}[p])()}
function dashboard(){let open=state.batches.filter(b=>!["Completed","Cancelled"].includes(b.status)).length,low=state.materials.filter(m=>m.stock<=m.reorder).length,hold=state.quality.filter(q=>["Hold","Fail","Reprocess"].includes(q.result)).length;return `${pagehead("Factory overview","Your textile processing operations at a glance",'<button class="btn" onclick="go(&quot;batches&quot;)">＋ New production batch</button>')}<div class="cards">${[["Open batches",open,"◷"],["Color recipes",state.recipes.length,"◉"],["Inventory items",state.materials.length,"▤"],["QC holds / failures",hold,"✓"]].map(a=>`<div class="card"><div class="stathead">${a[0]}<span class="staticon">${a[2]}</span></div><div class="stat">${a[1]}</div><div class="statnote">Current saved records</div></div>`).join("")}</div><div class="cols"><div class="card"><h3 class="cardtitle">Recent production batches</h3>${table(["Batch","Customer","Fabric","Planned kg","Status"],state.batches.slice(-6).reverse().map(b=>[esc(b.no),esc(b.customer||"—"),esc(b.fabric),b.planned,pill(b.status)]))}</div><div class="card"><h3 class="cardtitle">Low-stock alerts <span class="pill ${low?"red":""}">${low}</span></h3>${table(["Material","Stock","Reorder"],state.materials.filter(m=>m.stock<=m.reorder).map(m=>[esc(m.name),`${m.stock} ${esc(m.unit)}`,m.reorder]))}${!low?'<div class="empty">No low-stock items.</div>':""}<div class="notice">Demo data is for testing only. Verify all entries before operational use.</div></div></div>`}
function customers(){return `${pagehead("Customers","Maintain customer contacts and account details")}<div class="card"><h3 class="cardtitle">Add customer</h3><form class="formgrid" onsubmit="addCustomer(event)">${field("Customer / company name","name","text",true)}${field("Phone","phone")}${field("Email","email","email")}${field("Address","address")}<div class="field full"><label>Notes</label><textarea name="notes"></textarea></div><div class="full"><button class="btn">Save customer</button></div></form></div><div class="card"><div class="toolbar"><h3 class="cardtitle">Customer directory</h3><input class="search" placeholder="Search customers…" oninput="filterTable(this,'customerTable')"></div><div id="customerTable">${table(["Customer","Phone","Email","Address","Created"],state.customers.map(c=>[esc(c.name),esc(c.phone),esc(c.email),esc(c.address),esc(c.created||"—")]))}</div></div>`}
function addCustomer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));state.customers.push({...f,id:Date.now(),created:new Date().toLocaleDateString()});log("Customer created",f.name);render("customers");toast("Customer saved successfully")}
function inventory(){return `${pagehead("Inventory & Store","Track dyes, chemicals, fabric, lots and reorder levels")}<div class="card"><h3 class="cardtitle">Add inventory item</h3><form class="formgrid" onsubmit="addMaterial(event)">${field("Material name","name","text",true)}${selectField("Category","category",["Dye","Chemical","Grey Fabric","Finished Fabric","Packing","Other"])}${selectField("Stock unit","unit",["kg","g","liter","meter","roll","piece"])}${field("Opening stock","stock","number",true)}${field("Reorder level","reorder","number")}${field("Unit cost (PKR)","cost","number")}${field("Lot / batch number","lot")}${field("Expiry date","expiry","date")}<div class="full"><button class="btn">Save inventory item</button></div></form></div><div class="card"><div class="toolbar"><h3 class="cardtitle">Stock register</h3><input class="search" placeholder="Search inventory…" oninput="filterTable(this,'inventoryTable')"></div><div id="inventoryTable">${table(["Material","Category","Available stock","Unit","Reorder at","Unit cost","Lot","Stock status"],state.materials.map(m=>[esc(m.name),esc(m.category),m.stock,esc(m.unit),m.reorder,money(m.cost),esc(m.lot),m.stock<=m.reorder?pill("Low stock"):pill("In stock")]))}</div></div><div class="card"><h3 class="cardtitle">Stock adjustment / receipt</h3><form class="formgrid" onsubmit="stockMove(event)">${selectField("Material","material",state.materials.map(m=>({value:m.id,label:m.name})) ,true)}${selectField("Movement","movement",["Receipt","Adjustment in","Issue","Adjustment out"])}${field("Quantity","quantity","number",true)}${field("Reference / batch","reference") }<div class="full"><button class="btn">Post stock movement</button></div></form><div class="notice">This browser demo uses local storage. For multi-user production, use a secure shared database and server-side stock transactions.</div></div>`}
function addMaterial(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),qty=Number(f.stock),cost=Number(f.cost||0),reorder=Number(f.reorder||0);if(qty<0||cost<0||reorder<0)return toast("Quantities and cost cannot be negative");let m={...f,id:Date.now(),stock:qty,cost,reorder};state.materials.push(m);if(qty)state.moves.unshift({date:new Date().toLocaleString(),name:m.name,movement:"Opening balance",quantity:qty,reference:"Opening stock"});log("Inventory item created",m.name);render("inventory");toast("Inventory item saved")}
function stockMove(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),m=state.materials.find(x=>x.id==f.material),q=Number(f.quantity);if(!m||q<=0)return toast("Enter a valid material and quantity");let incoming=["Receipt","Adjustment in"].includes(f.movement);if(!incoming&&q>m.stock)return toast("Insufficient stock — movement rejected");m.stock+=incoming?q:-q;state.moves.unshift({date:new Date().toLocaleString(),name:m.name,movement:f.movement,quantity:q,reference:f.reference});log("Stock movement",`${f.movement}: ${m.name}, ${q}`);render("inventory");toast("Stock ledger updated")}
function recipes(){let matopts=state.materials.map(m=>m.name);return `${pagehead("Color Recipe Laboratory","Build and cost recipe drafts. Qualified dyeing staff must validate every production recipe.")}<div class="alert">Safety note: calculated quantities are mathematical estimates, not validated dyeing instructions. Recipes start as Draft.</div><div class="card"><h3 class="cardtitle">Create color recipe</h3><form class="formgrid" id="recipeForm" onsubmit="addRecipe(event)">${field("Recipe number","no","text",true)}${field("Customer","customer")}${field("Fabric type / composition","fabric","text",true)}${field("Shade name","shade","text",true)}${field("Shade code","shadeCode")}${field("Fabric weight (kg)","weight","number",true)}${field("Liquor ratio","ratio","number",true,"e.g. 8","8")}<div class="full"><label>Recipe materials — rate as % OWF</label><div id="recipeItems"><div class="recipeitem"><select name="materialName"><option value="">Choose inventory item (optional)</option>${matopts.map(x=>`<option>${esc(x)}</option>`).join("")}</select><input name="rate" type="number" step="any" min="0" placeholder="Rate (%)"><button type="button" class="btn secondary small" onclick="removeRecipeItem(this)">Remove</button></div></div><button type="button" class="btn secondary small" onclick="addRecipeItem()">＋ Add material</button></div><div class="field full"><label>Lab-dip / process notes</label><textarea name="notes"></textarea></div><div class="full"><button class="btn">Save recipe draft</button></div></form></div><div class="card"><h3 class="cardtitle">Saved recipes</h3>${table(["Recipe","Customer","Fabric","Shade","Weight kg","Liquor estimate L*","Materials / quantities","Est. material cost","Status"],state.recipes.map(r=>[esc(r.no),esc(r.customer),esc(r.fabric),esc(r.shade),r.weight,(r.weight*r.ratio).toFixed(2),r.items.map(i=>`${esc(i.name)}: ${i.qty.toFixed(3)} kg`).join("<br>")||"—",money(r.cost),pill(r.status)]))}<p class="smallmuted">* Liquor volume estimate assumes approximately 1 kg/L. Actual process settings must be validated.</p></div>`}
function addRecipeItem(){let d=document.createElement("div");d.className="recipeitem";d.innerHTML=`<select name="materialName"><option value="">Choose inventory item (optional)</option>${state.materials.map(m=>`<option>${esc(m.name)}</option>`).join("")}</select><input name="rate" type="number" step="any" min="0" placeholder="Rate (%)"><button type="button" class="btn secondary small" onclick="removeRecipeItem(this)">Remove</button>`;document.getElementById("recipeItems").appendChild(d)}
function removeRecipeItem(b){b.parentElement.remove()}
function addRecipe(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),weight=Number(f.weight),ratio=Number(f.ratio);if(weight<=0||ratio<=0)return toast("Weight and liquor ratio must be positive");if(state.recipes.some(r=>r.no===f.no))return toast("Recipe number must be unique");let names=[...e.target.querySelectorAll('[name="materialName"]')],rates=[...e.target.querySelectorAll('[name="rate"]')],items=[];for(let i=0;i<names.length;i++){let name=names[i].value,rate=Number(rates[i].value||0);if(name&&rate>=0){let m=state.materials.find(x=>x.name===name),qty=weight*rate/100;items.push({name,rate,qty,unitCost:Number(m?.cost||0)})}}let r={id:Date.now(),no:f.no,customer:f.customer,fabric:f.fabric,shade:f.shade,shadeCode:f.shadeCode,weight,ratio,notes:f.notes,items,cost:items.reduce((a,i)=>a+i.qty*i.unitCost,0),status:"Draft",created:new Date().toLocaleString()};state.recipes.push(r);log("Recipe draft created",r.no);render("recipes");toast("Recipe saved as Draft")}
function batches(){return `${pagehead("Production Batches","Plan dyeing jobs and record output, machines and process status")}<div class="card"><h3 class="cardtitle">Create production batch</h3><form class="formgrid" onsubmit="addBatch(event)">${field("Batch number","no","text",true)}${field("Customer","customer")}${field("Fabric","fabric","text",true)}${field("Shade","shade","text",true)}${selectField("Recipe","recipe",[{value:"",label:"No recipe linked"},...state.recipes.map(r=>({value:r.no,label:r.no+" — "+r.shade+" ("+r.status+")"}))])}${field("Machine ID","machine")}${field("Planned weight (kg)","planned","number",true)}${selectField("Initial status","status",["Planned","In Progress","On Hold","Completed","Cancelled"])}<div class="field full"><label>Process notes</label><textarea name="notes"></textarea></div><div class="full"><button class="btn">Create batch</button></div></form></div><div class="card"><h3 class="cardtitle">Batch register</h3>${table(["Batch","Customer","Fabric","Shade","Recipe","Machine","Planned kg","Actual kg","Status","Update"],state.batches.map(b=>[esc(b.no),esc(b.customer),esc(b.fabric),esc(b.shade),esc(b.recipe||"—"),esc(b.machine),b.planned,b.actual||0,pill(b.status),`<button class="btn secondary small" onclick="editBatch(${b.id})">Update</button>`]))}</div><div class="card ${window.editingBatch?'':'hide'}" id="batchEditor"></div>`}
function addBatch(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),planned=Number(f.planned);if(planned<=0)return toast("Planned weight must be positive");if(state.batches.some(b=>b.no===f.no))return toast("Batch number must be unique");state.batches.push({...f,id:Date.now(),planned,actual:0});log("Production batch created",f.no);render("batches");toast("Production batch created")}
function editBatch(id){let b=state.batches.find(x=>x.id===id);if(!b)return;let box=document.getElementById("batchEditor");box.classList.remove("hide");box.innerHTML=`<h3 class="cardtitle">Update ${esc(b.no)}</h3><form class="formgrid" onsubmit="saveBatch(event,${id})">${field("Actual output (kg)","actual","number",true,"",b.actual||0)}${selectField("Status","status",["Planned","In Progress","On Hold","Completed","Cancelled"].map(x=>({value:x,label:x})),true)}<div class="field full"><label>Update notes</label><textarea name="notes">${esc(b.notes||"")}</textarea></div><div class="full"><button class="btn">Save update</button></div></form>`;box.scrollIntoView({behavior:"smooth"})}
function saveBatch(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),b=state.batches.find(x=>x.id===id);if(Number(f.actual)<0)return toast("Output cannot be negative");b.actual=Number(f.actual);b.status=f.status;b.notes=f.notes;log("Production batch updated",b.no+" → "+b.status);render("batches");toast("Batch updated")}
function quality(){return `${pagehead("Quality Control","Capture actual test results and inspection decisions")}<div class="card"><h3 class="cardtitle">Record fabric inspection</h3><form class="formgrid" onsubmit="addQC(event)">${selectField("Production batch","batch",state.batches.map(b=>({value:b.no,label:b.no+" — "+b.shade})),true)}${selectField("Result","result",["Hold","Pass","Fail","Reprocess"])}${field("GSM","gsm","number")}${field("Width (cm)","width","number")}${field("Shrinkage (%)","shrinkage","number")}${field("Delta E (instrument reading)","deltaE","number")}${field("Colorfastness / test notes","fastness")}${field("Inspector","inspector")}<div class="field full"><label>Defects / comments</label><textarea name="defects"></textarea></div><div class="full"><button class="btn">Save QC inspection</button></div></form></div><div class="card"><h3 class="cardtitle">Inspection history</h3>${table(["Batch","GSM","Width cm","Shrinkage %","Delta E","Result","Inspector","Defects","Date"],state.quality.map(q=>[esc(q.batch),esc(q.gsm),esc(q.width),esc(q.shrinkage),esc(q.deltaE),pill(q.result),esc(q.inspector),esc(q.defects),esc(q.date)]))}</div>`}
function addQC(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!state.batches.some(b=>b.no===f.batch))return toast("Select a valid batch");state.quality.unshift({...f,id:Date.now(),date:new Date().toLocaleString()});log("QC inspection recorded",f.batch+" "+f.result);render("quality");toast("QC inspection saved")}
function reports(){let all=[["Customers",state.customers.length],["Inventory items",state.materials.length],["Recipes",state.recipes.length],["Production batches",state.batches.length],["QC inspections",state.quality.length],["Stock movements",state.moves.length]];return `${pagehead("Reports & Export","Review operational counts and export records as CSV")}<div class="cards">${all.map(a=>`<div class="card"><div class="stathead">${a[0]}</div><div class="stat">${a[1]}</div></div>`).join("")}</div><div class="card"><h3 class="cardtitle">Export data</h3><p class="smallmuted">Download a CSV file for review in Excel. Exports use records saved in this browser.</p><div class="actions">${["customers","materials","recipes","batches","quality","moves","logs"].map(k=>`<button class="btn secondary" onclick="exportCSV('${k}')">Export ${k}</button>`).join("")}</div></div><div class="card"><h3 class="cardtitle">Recent audit trail</h3>${table(["Date","Action","Details"],state.logs.slice(0,30).map(l=>[esc(l.date),esc(l.action),esc(l.detail)]))}</div>`}
function exportCSV(key){let arr=state[key]||[];if(!arr.length)return toast("No records to export");let cols=[...new Set(arr.flatMap(o=>Object.keys(o)))],csv=[cols.join(","),...arr.map(o=>cols.map(c=>'"'+String(typeof o[c]==="object"?JSON.stringify(o[c]):o[c]??"").replace(/"/g,'""')+'"').join(","))].join("\r\n"),blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zimbas_"+key+".csv";a.click();URL.revokeObjectURL(a.href);toast("CSV export started")}
function settings(){return `${pagehead("Settings & Data","Manage demo data and local browser storage")}<div class="card"><h3 class="cardtitle">Company profile</h3><div class="formgrid"><div class="field"><label>Company name</label><input value="Zimbas Industries" readonly></div><div class="field"><label>System</label><input value="Textile Dyeing & Processing ERP" readonly></div><div class="field"><label>Currency</label><input value="PKR — Pakistani Rupee" readonly></div><div class="field"><label>Storage mode</label><input value="Local browser storage" readonly></div></div><div class="notice">This website saves data in this browser only. It does not currently have shared user accounts, cloud synchronization, server-side access control or automatic cloud backups.</div></div><div class="card"><h3 class="cardtitle">Backup and restore</h3><p>Download a JSON backup before clearing browser data or moving computers.</p><div class="actions"><button class="btn" onclick="backup()">Download backup</button><label class="btn secondary">Restore backup<input type="file" accept="application/json" class="hide" onchange="restore(event)"></label><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div></div>`}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zimbas_erp_backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded")}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.customers||!s.materials||!s.batches)throw Error();state=s;save();go("dashboard");toast("Backup restored")}catch{toast("Invalid backup file")}};r.readAsText(file)}
function resetDemo(){if(confirm("Replace all current local records with the original demo data? Download a backup first if needed.")){state=structuredClone(initial);save();go("dashboard");toast("Demo data reset")}}
function filterTable(input,id){let q=input.value.toLowerCase();document.querySelectorAll("#"+id+" tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
load();initNav();save();go("dashboard");

<div id="zimbasAuthGate" style="position:fixed;inset:0;z-index:999999;background:#f3f6fa;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,sans-serif">
  <form id="zimbasAuthForm" style="background:#fff;padding:30px;border-radius:14px;box-shadow:0 10px 35px #10253f20;width:360px;max-width:100%">

    <input id="zimbasAuthEmail" type="email" autocomplete="username" required placeholder="Your Supabase user email" style="width:100%;padding:12px;border:1px solid #d7e0ea;border-radius:8px;box-sizing:border-box">
    <label for="zimbasAuthPassword" style="display:block;margin:12px 0 5px;font-weight:700">Password</label>
    <input id="zimbasAuthPassword" type="password" autocomplete="current-password" required placeholder="Password" style="width:100%;padding:12px;border:1px solid #d7e0ea;border-radius:8px;box-sizing:border-box">
    <button id="zimbasAuthSubmit" type="submit" style="width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#10a7a0;color:#fff;font-weight:700">Sign in</button>
    <p id="zimbasAuthMessage" role="status" style="font-size:13px;line-height:1.5;color:#a32d38;overflow-wrap:anywhere"></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const gate = document.getElementById('zimbasAuthGate');
  const form = document.getElementById('zimbasAuthForm');
  const message = document.getElementById('zimbasAuthMessage');
  const submit = document.getElementById('zimbasAuthSubmit');
  const showError = (text) => { message.textContent = text; };
  const unlock = () => { gate.remove(); };

  if (!window.supabase || !window.supabase.createClient) {
    showError('Supabase library did not load. Check your internet connection and refresh this page.');
    return;
  }

  const supabaseClient = window.supabase.createClient(
    'https://aweyeoayzjunlzjlbxra.supabase.co',
    'sb_publishable_HWCnnlV1zV8nNQ_0bgukrg_tdBYMGK0'
  );

  // If the user already has a valid session, show the existing ERP dashboard.
  supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) showError(error.message);
    else if (data && data.session) unlock();
  }).catch((error) => showError(error.message || 'Could not check your login session.'));

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    showError('');
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('zimbasAuthEmail').value.trim(),
        password: document.getElementById('zimbasAuthPassword').value
      });
      if (error) {
        showError(error.message);
        return;
      }
      if (data && data.session) unlock();
      else showError('Login did not return a session. Please try again.');
    } catch (error) {
      showError(error.message || 'Login failed. Check your internet connection.');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }
  });
})();
</script>
