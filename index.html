
<!-- ZIMBAS SUPABASE LOGIN -->
<div id="authGate" style="position:fixed;inset:0;z-index:99999;background:#f3f6fa;display:flex;align-items:center;justify-content:center;font-family:Arial">
  <form id="loginForm" style="background:white;padding:30px;border-radius:14px;width:320px;max-width:85%">
    <h2>ZIMBAS INDUSTRIES</h2>
    <p>Secure ERP Login</p>
    <input id="email" type="email" placeholder="Email address" required style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box">
    <input id="password" type="password" placeholder="Password" required style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box">
    <button id="loginBtn" type="submit" style="width:100%;padding:12px;background:#10a7a0;color:white;border:0">Sign in</button>
    <p id="loginMsg"></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  'https://aweyeoayzjunlzjlbxra.supabase.co',
  'sb_publishable_HWCnnlV1zV8nNQ_0bgukrg_tdBYMGK0'
);

const gate = document.getElementById('authGate');
const app = document.querySelector('.app');

if (app) app.style.display = 'none';

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  msg.textContent = 'Signing in...';

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  btn.disabled = false;

  if (error) {
    msg.textContent = error.message;
    return;
  }

  gate.style.display = 'none';
  if (app) app.style.display = 'flex';
});

(async function() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    gate.style.display = 'none';
    if (app) app.style.display = 'flex';
  }
})();
</script>
<!-- END ZIMBAS LOGIN -->
